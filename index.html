<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15222E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="운행일지">
<title>저온 수송 운행일지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#EDF2F4; --surface:#FFFFFF; --sunk:#E3EAEE; --ink:#15222E; --muted:#5B6B78; --line:#CBD6DD;
  --cold:#1B5E8C; --cold-soft:#DCEAF4; --hivis:#F2B31B; --hivis-ink:#2A1F00; --danger:#B53A2E;
  --shadow:0 1px 2px rgba(21,34,46,.06),0 6px 20px rgba(21,34,46,.06);
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E161D; --surface:#16212B; --sunk:#1D2A35; --ink:#E4ECF1; --muted:#90A2B0; --line:#2B3A46;
  --cold:#6FB3E3; --cold-soft:#1C3345; --hivis:#F2B31B; --hivis-ink:#2A1F00; --danger:#E77B6F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --ground:#0E161D; --surface:#16212B; --sunk:#1D2A35; --ink:#E4ECF1; --muted:#90A2B0; --line:#2B3A46;
  --cold:#6FB3E3; --cold-soft:#1C3345; --hivis:#F2B31B; --hivis-ink:#2A1F00; --danger:#E77B6F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 64px);display:flex;flex-direction:column;gap:20px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cold);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand small{display:block;font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.brand h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.tabs{display:flex;background:var(--sunk);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.status.ok i{background:#2F9E6A}.status.warn i{background:var(--hivis)}

/* month bar + summary */
.ledger{background:var(--ink);color:var(--ground);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
:root[data-theme="dark"] .ledger{background:var(--sunk);color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ledger{background:var(--sunk);color:var(--ink)}}
.monthnav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.monthnav button{border:1px solid color-mix(in srgb,currentColor 30%,transparent);background:transparent;border-radius:8px;width:34px;height:34px;font-size:16px}
.monthnav h2{margin:0;font-size:20px;font-weight:700;min-width:130px;text-align:center}
.monthnav .today{width:auto;padding:0 12px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:color-mix(in srgb,currentColor 18%,transparent);border-radius:10px;overflow:hidden}
.stat{background:var(--ink);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
:root[data-theme="dark"] .stat{background:var(--sunk)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stat{background:var(--sunk)}}
.stat span{font-size:12px;opacity:.7}
.stat b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:600;white-space:nowrap}
.stat.total{background:var(--hivis)!important;color:var(--hivis-ink)}
.stat.total span{opacity:.8}
.stat.total b{font-size:20px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat b{font-size:16px}.stat.total b{font-size:18px}}

.grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h3{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
form.entry{display:flex;flex-direction:column;gap:12px}
@media (min-width:861px){.formpanel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
input:focus,select:focus{border-color:var(--cold)}
.route{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:end}
.route .arrow{padding-bottom:10px;color:var(--muted)}
.tons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tons label{position:relative}
.tons input{position:absolute;opacity:0;pointer-events:none}
.tons span{display:block;text-align:center;border:1px solid var(--line);border-radius:8px;padding:8px 0;font-weight:600}
.tons input:checked+span{background:var(--cold);border-color:var(--cold);color:var(--surface)}
.tons input:focus-visible+span{outline:2px solid var(--cold);outline-offset:2px}
.price{background:var(--cold-soft);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.price small{color:var(--muted);font-size:12px;display:block}
.price input{width:130px;text-align:right;font-family:var(--mono);font-weight:600;font-size:17px;background:var(--surface)}
.price .reset{border:0;background:none;color:var(--cold);font-size:12px;padding:0;text-decoration:underline}
.btns{display:flex;gap:8px}
.primary{flex:1;border:0;background:var(--cold);color:var(--surface);border-radius:9px;padding:11px;font-weight:700}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 14px;font-weight:600}
.hint{font-size:12px;color:var(--muted);margin:0}

/* log */
.logtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.logtools input{width:auto;flex:1;min-width:140px;padding:7px 10px}
.day{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.day:first-of-type{border-top:0;margin-top:0;padding-top:0}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.dayhead strong{font-size:14px}
.dayhead strong em{font-style:normal;color:var(--muted);font-weight:500;margin-left:6px;font-size:13px}
.dayhead .num{font-size:13px;color:var(--muted)}
.trip{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;background:var(--sunk)}
.trip+.trip{margin-top:6px}
.trip .where{font-weight:600;min-width:0}
.trip .where b{font-weight:600}
.trip .meta{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:12.5px;color:var(--muted);margin-top:2px}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--cold-soft);color:var(--cold)}
.chip.x{background:color-mix(in srgb,var(--hivis) 25%,transparent);color:var(--ink)}
.trip .amt{text-align:right;font-family:var(--mono);font-weight:600;white-space:nowrap}
.trip .amt small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.acts{display:flex;gap:4px}
.acts button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 8px;font-size:12.5px}
.acts .del{color:var(--danger)}
.trip.editing{outline:2px solid var(--cold)}
@media (max-width:520px){.trip{grid-template-columns:minmax(0,1fr) auto}.acts{grid-column:1/-1;justify-content:flex-end}}
.empty{text-align:center;color:var(--muted);padding:32px 12px;border:1px dashed var(--line);border-radius:10px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* rate sheet */
.ratewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.rates{border-collapse:collapse;width:100%;min-width:560px}
.rates th{background:var(--sunk);font-size:12.5px;color:var(--muted);text-align:left;padding:8px 10px;position:sticky;top:0}
.rates th.r{text-align:right}
.rates td{border-top:1px solid var(--line);padding:4px 6px}
.rates td.grp{font-weight:700;vertical-align:top;padding:9px 10px;background:var(--surface)}
.rates input{border-color:transparent;background:transparent;padding:6px 6px}
.rates input:hover{border-color:var(--line)}
.rates input.r{text-align:right;font-family:var(--mono)}
.rates .del{border:0;background:none;color:var(--danger);font-size:18px;line-height:1;padding:4px 8px}
.addroute{display:grid;grid-template-columns:1fr 1fr repeat(3,90px) auto;gap:6px;margin-top:12px}
@media (max-width:700px){.addroute{grid-template-columns:1fr 1fr}.addroute button{grid-column:1/-1}}
.note{font-size:12.5px;color:var(--muted)}

.backup{border-top:1px solid var(--line);margin-top:16px;padding-top:12px;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:99px;font-size:13.5px;box-shadow:var(--shadow);z-index:10}
@media (prefers-reduced-motion:no-preference){.toast{transition:opacity .2s}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <small>남양유업 저온 수송 · 편도 기준</small>
      <h1>운행일지</h1>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
      <div class="tabs" role="tablist">
        <button id="tab-log" role="tab" aria-selected="true">운행 기록</button>
        <button id="tab-rates" role="tab" aria-selected="false">단가표 수정</button>
      </div>
      <div class="status" id="status"><i></i><span>불러오는 중…</span></div>
    </div>
  </header>

  <!-- LOG VIEW -->
  <section id="view-log" style="display:flex;flex-direction:column;gap:20px">
    <div class="ledger">
      <div class="monthnav">
        <button id="prevM" aria-label="이전 달">‹</button>
        <h2 id="monthLabel">—</h2>
        <button id="nextM" aria-label="다음 달">›</button>
        <button id="thisM" class="today">이번 달</button>
      </div>
      <div class="stats">
        <div class="stat"><span>운행 건수</span><b id="sCount">0건</b></div>
        <div class="stat"><span>운송비 (단가 합)</span><b id="sBase">0</b></div>
        <div class="stat"><span>대기료 · 공차운임</span><b id="sExtra">0</b></div>
        <div class="stat total"><span id="sTotalLbl">월 합계 (VAT 포함)</span><b id="sTotal">0</b></div>
      </div>
      <div class="note" style="color:inherit;opacity:.7" id="sVatLine">공급가 0 + 부가세 0</div>
    </div>

    <div class="grid">
      <div class="panel formpanel">
        <h3><span id="formTitle">운행 추가</span></h3>
        <form class="entry" id="entry" autocomplete="off">
          <div class="field"><label for="fDate">운행일</label><input type="date" id="fDate" required></div>
          <div class="route">
            <div class="field"><label for="fFrom">상차지</label><select id="fFrom"></select></div>
            <div class="arrow">→</div>
            <div class="field"><label for="fTo">하차지</label><select id="fTo"></select></div>
          </div>
          <div class="field"><label>톤수</label>
            <div class="tons">
              <label><input type="radio" name="ton" id="t5" value="5" checked><span>5톤</span></label>
              <label><input type="radio" name="ton" id="t7" value="7"><span>7톤</span></label>
              <label><input type="radio" name="ton" id="t11" value="11"><span>11톤</span></label>
            </div>
          </div>
          <div class="price">
            <div><small>단가 (자동)</small><button type="button" class="reset" id="resetPrice" hidden>단가표 금액으로</button></div>
            <input id="fRate" class="num" inputmode="numeric" aria-label="단가">
          </div>
          <div class="row2">
            <div class="field"><label for="fWait">대기료</label><input id="fWait" class="num" inputmode="numeric" placeholder="0"></div>
            <div class="field"><label for="fEmpty">공차운임</label><input id="fEmpty" class="num" inputmode="numeric" placeholder="0"></div>
          </div>
          <div class="row2">
            <div class="field"><label for="fCar">차량번호</label><input id="fCar" placeholder="예: 12가3456"></div>
            <div class="field"><label for="fMemo">메모</label><input id="fMemo" placeholder="선택"></div>
          </div>
          <div class="btns">
            <button type="submit" class="primary" id="submitBtn">운행 추가</button>
            <button type="button" class="ghost" id="cancelEdit" hidden>취소</button>
          </div>
          <p class="hint">단가는 저장 시점 금액으로 기록돼서, 나중에 단가표를 바꿔도 지난 기록은 그대로 남아요.</p>
        </form>
      </div>

      <div class="panel">
        <h3><span>일자별 기록</span>
          <span class="logtools"><button class="ghost" id="csvBtn" style="padding:6px 12px;font-size:13px">CSV 내보내기</button></span>
        </h3>
        <div class="logtools" style="margin-bottom:12px"><input id="search" placeholder="상차지·하차지·차량번호·메모 검색"></div>
        <div id="log"></div>
        <div class="backup">
          <div class="btns"><button class="ghost" id="backupBtn">백업 저장</button><button class="ghost" id="restoreBtn">백업 불러오기</button></div>
          <input type="file" id="restoreFile" accept=".json,application/json" hidden>
          <p class="hint" id="backupNote"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- RATES VIEW -->
  <section id="view-rates" class="panel" hidden>
    <h3><span>구간별 단가표 <span class="note" style="font-weight:500">단위: 원 · 칸을 눌러 바로 수정</span></span></h3>
    <div class="ratewrap">
      <table class="rates">
        <thead><tr><th>상차지</th><th>하차지</th><th class="r">5톤</th><th class="r">7톤</th><th class="r">11톤</th><th></th></tr></thead>
        <tbody id="rateBody"></tbody>
      </table>
    </div>
    <div class="addroute">
      <input id="nFrom" placeholder="상차지" list="places">
      <input id="nTo" placeholder="하차지" list="places">
      <input id="n5" class="num" inputmode="numeric" placeholder="5톤">
      <input id="n7" class="num" inputmode="numeric" placeholder="7톤">
      <input id="n11" class="num" inputmode="numeric" placeholder="11톤">
      <button class="primary" id="addRoute" style="padding:9px 16px">구간 추가</button>
    </div>
    <datalist id="places"></datalist>
    <p class="note">※ 편도 운송비 기준 / 대기료, 공차운임 별도 / 부가세 별도</p>
    <div class="row2" style="max-width:420px;margin-top:8px">
      <div class="field"><label for="vatRate">부가세율 (%)</label><input id="vatRate" class="num" inputmode="decimal"></div>
      <div class="field"><label for="vatOn">월 합계에 부가세</label><select id="vatOn"><option value="1">포함해서 표시</option><option value="0">빼고 표시</option></select></div>
    </div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const DEFAULT_ROUTES = [
 ["경주공장","고양물류센터(냉장)",400,440,470],["경주공장","용인물류센터",330,380,400],["경주공장","세종공장",300,340,370],["경주공장","나주공장",340,380,410],["경주공장","목천",300,350,370],["경주공장","제때오산",350,0,0],
 ["세종공장","고양물류센터(냉장)",260,300,330],["세종공장","용인물류센터",210,250,280],["세종공장","경주공장",320,360,390],["세종공장","나주공장",300,340,370],["세종공장","롯데푸드(주)",140,170,190],["세종공장","목천",140,170,190],["세종공장","청주냉장",140,170,190],
 ["나주공장","고양물류센터(냉장)",400,440,470],["나주공장","용인물류센터",350,390,420],["나주공장","경주공장",340,380,410,80],["나주공장","세종공장",310,330,340],["나주공장","김해물류센터",350,390,420],["나주공장","목천",310,350,380],["나주공장","천안",310,350,380],
 ["목천","고양물류센터(냉장)",240,280,310],["목천","용인물류센터",140,170,190],["목천","리치냉장",130,150,170],["목천","경주공장",300,350,370],["목천","세종공장",140,170,190],["목천","김해물류센터",330,370,400],["목천","나주공장",310,350,380],
 ["천안","고양물류센터(냉장)",240,280,310],["천안","경주공장",310,370,400],["천안","청주냉장",140,170,190],
 ["청주냉장","고양물류센터(냉장)",250,300,320],["청주냉장","용인물류센터",190,240,260],["청주냉장","경주공장",310,350,380],["청주냉장","세종공장",130,160,180],["청주냉장","나주공장",310,350,380],
 ["롯데푸드(주)","세종공장",140,170,190],["서강유업㈜","세종공장",300,340,370]
].map(([from,to,a,b,c,empty=0])=>({from,to,r5:a*1000,r7:b*1000,r11:c*1000,empty:empty*1000}));

const $ = id => document.getElementById(id);
const won = n => (Math.round(n)||0).toLocaleString("ko-KR");
const toNum = v => Number(String(v??"").replace(/[^\d.-]/g,""))||0;
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const DOW = ["일","월","화","수","목","금","토"];
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let config = {routes: DEFAULT_ROUTES, vatRate: 10, vatOn: true};
let trips = [];            // {id,date,from,to,ton,rate,wait,empty,car,memo,createdAt}
let db = null;
const now = new Date();
let viewY = now.getFullYear(), viewM = now.getMonth(); // 0-based
let editingId = null, rateTouched = false;

/* ---------- storage: db capability with local fallback ---------- */
const LS = { get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}} };
function setStatus(kind,text){ const s=$("status"); s.className="status "+kind; s.querySelector("span").textContent=text; }

function useLocal(){
  const c = LS.get("unhaeng.config"); if (c && Array.isArray(c.routes)) config = {...config, ...c};
  trips = LS.get("unhaeng.trips") || [];
  setStatus("ok","이 기기에 자동 저장됨");
  renderAll();
}
async function saveConfig(){
  if (db){ try{ await db.doc("config/rates").set(config); }catch(e){ toast("단가표 저장 실패: "+(e.message||e.code)); } }
  else LS.set("unhaeng.config", config);
}
async function saveTrip(t){
  const {id, ...data} = t;
  if (db){
    try{
      if (id) await db.doc("trips/"+id).set(data); else await db.collection("trips").add(data);
    }catch(e){ toast("저장 실패: "+(e.message||e.code)); return false; }
  } else {
    if (id) trips = trips.map(x=>x.id===id?t:x); else trips.push({...data, id:"l"+Date.now()});
    LS.set("unhaeng.trips", trips); renderAll();
  }
  return true;
}
async function removeTrip(id){
  if (db){ try{ await db.doc("trips/"+id).delete(); }catch(e){ toast("삭제 실패: "+(e.message||e.code)); } }
  else { trips = trips.filter(x=>x.id!==id); LS.set("unhaeng.trips",trips); renderAll(); }
}

/* ---------- helpers ---------- */
const froms = () => [...new Set(config.routes.map(r=>r.from))];
const tosFor = f => config.routes.filter(r=>r.from===f).map(r=>r.to);
const findRoute = (f,t) => config.routes.find(r=>r.from===f&&r.to===t);
const findRate = (f,t,ton) => { const r = findRoute(f,t); return r ? (r["r"+ton]||0) : null; };
const tripTotal = t => toNum(t.rate)+toNum(t.wait)+toNum(t.empty);
const monthKey = () => `${viewY}-${pad(viewM+1)}`;
let toastT;
function toast(msg){ const el=$("toast"); el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2200); }

/* ---------- form ---------- */
function fillFrom(keep){
  const sel=$("fFrom"), cur=keep ?? sel.value;
  const list = froms();
  if (cur && !list.includes(cur)) list.push(cur);
  sel.innerHTML = list.map(f=>`<option>${esc(f)}</option>`).join("");
  if (cur) sel.value = cur;
}
function fillTo(keep){
  const sel=$("fTo"), cur=keep ?? sel.value;
  const list = tosFor($("fFrom").value);
  if (cur && !list.includes(cur) && keep) list.push(cur);
  sel.innerHTML = list.map(t=>`<option>${esc(t)}</option>`).join("");
  if (cur && list.includes(cur)) sel.value = cur;
}
const selTon = () => document.querySelector('input[name="ton"]:checked').value;
function updatePrice(resetEmpty=false){
  const route = findRoute($("fFrom").value,$("fTo").value);
  const r = route ? (route["r"+selTon()]||0) : null;
  if (!rateTouched) $("fRate").value = r==null ? "" : won(r);
  if (resetEmpty) $("fEmpty").value = route?.empty ? won(route.empty) : "";
  $("resetPrice").hidden = !(rateTouched && r!=null && toNum($("fRate").value)!==r);
}
$("fFrom").addEventListener("change",()=>{ fillTo(); rateTouched=false; updatePrice(true); });
$("fTo").addEventListener("change",()=>{ rateTouched=false; updatePrice(true); });
document.querySelectorAll('input[name="ton"]').forEach(r=>r.addEventListener("change",()=>{ rateTouched=false; updatePrice(); }));
$("fRate").addEventListener("input",()=>{ rateTouched=true; updatePrice(); });
$("resetPrice").addEventListener("click",()=>{ rateTouched=false; updatePrice(); });
["fRate","fWait","fEmpty"].forEach(id=>$(id).addEventListener("blur",e=>{ if(e.target.value) e.target.value=won(toNum(e.target.value)); }));

function resetForm(){
  editingId=null; rateTouched=false;
  const keepDate=$("fDate").value;
  $("entry").reset();
  $("fDate").value = keepDate || ymd(new Date());
  fillFrom(); fillTo(); updatePrice(true);
  $("formTitle").textContent="운행 추가"; $("submitBtn").textContent="운행 추가"; $("cancelEdit").hidden=true;
  renderLog();
}
$("cancelEdit").addEventListener("click",resetForm);

$("entry").addEventListener("submit", async e => {
  e.preventDefault();
  const t = {
    date:$("fDate").value, from:$("fFrom").value, to:$("fTo").value, ton:selTon(),
    rate:toNum($("fRate").value), wait:toNum($("fWait").value), empty:toNum($("fEmpty").value),
    car:$("fCar").value.trim(), memo:$("fMemo").value.trim()
  };
  if (!t.date||!t.from||!t.to){ toast("날짜와 상차지·하차지를 골라주세요"); return; }
  if (editingId){ const old=trips.find(x=>x.id===editingId); t.id=editingId; t.createdAt=old?.createdAt||Date.now(); }
  else t.createdAt=Date.now();
  const wasEdit=!!editingId;
  if (await saveTrip(t)){
    toast(wasEdit?"수정했어요":"운행을 추가했어요");
    const [y,m]=t.date.split("-").map(Number); viewY=y; viewM=m-1;
    const car=t.car; resetForm(); $("fCar").value=car; renderAll();
  }
});

function startEdit(id){
  const t=trips.find(x=>x.id===id); if(!t) return;
  editingId=id;
  $("fDate").value=t.date; fillFrom(t.from); fillTo(t.to);
  document.getElementById("t"+t.ton).checked=true;
  rateTouched=true; $("fRate").value=won(t.rate);
  $("fWait").value=t.wait?won(t.wait):""; $("fEmpty").value=t.empty?won(t.empty):"";
  $("fCar").value=t.car||""; $("fMemo").value=t.memo||"";
  updatePrice();
  $("formTitle").textContent=`${Number(t.date.slice(5,7))}월 ${Number(t.date.slice(8))}일 기록 수정`;
  $("submitBtn").textContent="수정 저장"; $("cancelEdit").hidden=false;
  renderLog();
  if (window.innerWidth<861) $("entry").scrollIntoView({behavior:"smooth",block:"start"});
}

/* ---------- log render ---------- */
function monthTrips(){ return trips.filter(t=>(t.date||"").startsWith(monthKey())); }
function renderSummary(){
  const list = monthTrips();
  const base = list.reduce((s,t)=>s+toNum(t.rate),0);
  const extra = list.reduce((s,t)=>s+toNum(t.wait)+toNum(t.empty),0);
  const supply = base+extra, vat = Math.round(supply*(toNum(config.vatRate))/100);
  $("monthLabel").textContent = `${viewY}년 ${viewM+1}월`;
  $("sCount").textContent = `${list.length}건`;
  $("sBase").textContent = won(base);
  $("sExtra").textContent = won(extra);
  if (config.vatOn){ $("sTotalLbl").textContent="월 합계 (VAT 포함)"; $("sTotal").textContent=won(supply+vat); }
  else { $("sTotalLbl").textContent="월 합계 (VAT 별도)"; $("sTotal").textContent=won(supply); }
  $("sVatLine").textContent = `공급가 ${won(supply)}원 + 부가세 ${config.vatRate}% ${won(vat)}원 = ${won(supply+vat)}원`;
}
function renderLog(){
  const q = $("search").value.trim().toLowerCase();
  let list = monthTrips();
  if (q) list = list.filter(t=>[t.from,t.to,t.car,t.memo].join(" ").toLowerCase().includes(q));
  list.sort((a,b)=> a.date===b.date ? (a.createdAt||0)-(b.createdAt||0) : a.date<b.date?1:-1);
  const box=$("log");
  if (!list.length){
    box.innerHTML = q ? `<div class="empty"><b>검색 결과가 없어요</b>다른 단어로 찾아보세요.</div>`
      : `<div class="empty"><b>${viewM+1}월 운행 기록이 아직 없어요</b>왼쪽에서 날짜·상차지·하차지·톤수를 고르고 추가하면 여기에 날짜별로 쌓여요.</div>`;
    return;
  }
  const groups = {};
  list.forEach(t=>(groups[t.date]??=[]).push(t));
  box.innerHTML = Object.entries(groups).map(([date,ts])=>{
    const d=new Date(date+"T00:00:00"), sum=ts.reduce((s,t)=>s+tripTotal(t),0);
    return `<div class="day"><div class="dayhead"><strong>${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})<em>${ts.length}건</em></strong><span class="num">일계 ${won(sum)}원</span></div>
    ${ts.map(t=>{
      const extras=[]; if(toNum(t.wait)) extras.push(`<span class="chip x">대기 ${won(t.wait)}</span>`); if(toNum(t.empty)) extras.push(`<span class="chip x">공차 ${won(t.empty)}</span>`);
      const std=findRate(t.from,t.to,t.ton);
      return `<div class="trip${t.id===editingId?" editing":""}">
        <div><div class="where">${esc(t.from)} → ${esc(t.to)}</div>
          <div class="meta"><span class="chip">${esc(t.ton)}톤</span>${extras.join("")}${t.car?`<span>${esc(t.car)}</span>`:""}${t.memo?`<span>· ${esc(t.memo)}</span>`:""}</div></div>
        <div class="amt">${won(tripTotal(t))}<small>단가 ${won(t.rate)}${std!=null&&std!==toNum(t.rate)?" (현재 "+won(std)+")":""}</small></div>
        <div class="acts"><button data-edit="${t.id}">수정</button><button class="del" data-del="${t.id}">삭제</button></div>
      </div>`;}).join("")}</div>`;
  }).join("");
}
$("log").addEventListener("click",e=>{
  const ed=e.target.closest("[data-edit]"), dl=e.target.closest("[data-del]");
  if (ed) startEdit(ed.dataset.edit);
  if (dl){
    const b=dl; if (b.dataset.armed){ removeTrip(b.dataset.del); if(editingId===b.dataset.del) resetForm(); toast("삭제했어요"); }
    else { b.dataset.armed="1"; b.textContent="한 번 더"; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent="삭제"; } },2500); }
  }
});
$("search").addEventListener("input",renderLog);
$("prevM").onclick=()=>{ viewM--; if(viewM<0){viewM=11;viewY--;} renderSummary(); renderLog(); };
$("nextM").onclick=()=>{ viewM++; if(viewM>11){viewM=0;viewY++;} renderSummary(); renderLog(); };
$("thisM").onclick=()=>{ const n=new Date(); viewY=n.getFullYear(); viewM=n.getMonth(); renderSummary(); renderLog(); };

/* ---------- files ---------- */
function saveFile(name, text, type){
  const url=URL.createObjectURL(new Blob([text],{type:type+";charset=utf-8"}));
  const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
$("backupBtn").addEventListener("click",()=>{
  saveFile(`운행일지_백업_${ymd(new Date())}.json`, JSON.stringify({app:"unhaeng",savedAt:new Date().toISOString(),config,trips},null,1), "application/json");
  LS.set("unhaeng.lastBackup", Date.now()); renderBackupNote(); toast("백업 파일을 저장했어요");
});
$("restoreBtn").addEventListener("click",()=>$("restoreFile").click());
$("restoreFile").addEventListener("change", async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const d=JSON.parse(await f.text());
    if(!Array.isArray(d.trips)||!d.config||!Array.isArray(d.config.routes)) throw 0;
    if(!confirm(`백업(${d.trips.length}건)으로 지금 기록을 바꿀까요?`)) return;
    trips=d.trips; config={...config,...d.config};
    LS.set("unhaeng.trips",trips); LS.set("unhaeng.config",config); renderAll(); toast("백업을 불러왔어요");
  }catch{ toast("운행일지 백업 파일이 아니에요"); }
  e.target.value="";
});
function renderBackupNote(){
  const t=LS.get("unhaeng.lastBackup");
  $("backupNote").textContent = t ? `마지막 백업: ${new Date(t).toLocaleDateString("ko-KR")}` : "아직 백업한 적이 없어요. 휴대폰을 바꾸거나 인터넷 기록을 지우면 기록이 사라지니 한 달에 한 번은 백업해 주세요.";
}
renderBackupNote();

/* ---------- CSV ---------- */
$("csvBtn").addEventListener("click", async ()=>{
  const list = monthTrips().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0));
  if (!list.length){ toast("내보낼 기록이 없어요"); return; }
  const q = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const rows=[["운행일","상차지","하차지","톤수","단가","대기료","공차운임","합계","차량번호","메모"]];
  list.forEach(t=>rows.push([t.date,t.from,t.to,t.ton+"톤",t.rate,t.wait||0,t.empty||0,tripTotal(t),t.car,t.memo]));
  const supply=list.reduce((s,t)=>s+tripTotal(t),0), vat=Math.round(supply*toNum(config.vatRate)/100);
  rows.push([],["공급가 합계","","","","","","",supply],["부가세","","","","","","",vat],["총 합계","","","","","","",supply+vat]);
  const csv="﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n");
  saveFile(`운행일지_${monthKey()}.csv`, csv, "text/csv"); toast("CSV를 저장했어요");
});

/* ---------- rate sheet ---------- */
function renderRates(){
  const body=$("rateBody"); const order=froms(); let html="";
  order.forEach(f=>{
    const rs=config.routes.map((r,i)=>({r,i})).filter(x=>x.r.from===f);
    rs.forEach(({r,i},k)=>{
      html+=`<tr>${k===0?`<td class="grp" rowspan="${rs.length}">${esc(f)}</td>`:""}
      <td><input data-i="${i}" data-k="to" value="${esc(r.to)}" aria-label="하차지"></td>
      ${["r5","r7","r11"].map(c=>`<td><input class="r" inputmode="numeric" data-i="${i}" data-k="${c}" value="${won(r[c])}" aria-label="${c.slice(1)}톤"></td>`).join("")}
      <td><button class="del" data-rdel="${i}" aria-label="구간 삭제" title="구간 삭제">×</button></td></tr>`;
    });
  });
  body.innerHTML=html;
  $("places").innerHTML=[...new Set(config.routes.flatMap(r=>[r.from,r.to]))].map(p=>`<option value="${esc(p)}">`).join("");
  $("vatRate").value=config.vatRate; $("vatOn").value=config.vatOn?"1":"0";
}
$("rateBody").addEventListener("change",e=>{
  const el=e.target; if(!el.dataset.k) return;
  const r=config.routes[+el.dataset.i]; if(!r) return;
  if (el.dataset.k==="to"){ const v=el.value.trim(); if(!v){ el.value=r.to; return; } r.to=v; }
  else { r[el.dataset.k]=toNum(el.value); el.value=won(r[el.dataset.k]); }
  saveConfig(); toast("단가표를 수정했어요"); refreshFormOptions();
});
$("rateBody").addEventListener("click",e=>{
  const b=e.target.closest("[data-rdel]"); if(!b) return;
  if (b.dataset.armed){ config.routes.splice(+b.dataset.rdel,1); saveConfig(); renderRates(); refreshFormOptions(); toast("구간을 삭제했어요"); }
  else { b.dataset.armed="1"; b.textContent="삭제?"; b.style.fontSize="12px"; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent="×"; b.style.fontSize=""; } },2500); }
});
$("addRoute").addEventListener("click",()=>{
  const f=$("nFrom").value.trim(), t=$("nTo").value.trim();
  if(!f||!t){ toast("상차지와 하차지를 입력하세요"); return; }
  if (config.routes.some(r=>r.from===f&&r.to===t)){ toast("이미 있는 구간이에요. 표에서 금액만 고치세요"); return; }
  config.routes.push({from:f,to:t,r5:toNum($("n5").value),r7:toNum($("n7").value),r11:toNum($("n11").value)});
  ["nFrom","nTo","n5","n7","n11"].forEach(id=>$(id).value="");
  saveConfig(); renderRates(); refreshFormOptions(); toast(`${f} → ${t} 구간을 추가했어요`);
});
$("vatRate").addEventListener("change",e=>{ config.vatRate=toNum(e.target.value); saveConfig(); renderSummary(); });
$("vatOn").addEventListener("change",e=>{ config.vatOn=e.target.value==="1"; saveConfig(); renderSummary(); });

function refreshFormOptions(){
  const f=$("fFrom").value, t=$("fTo").value;
  fillFrom(f||undefined); fillTo(editingId?t:(t||undefined)); updatePrice();
}

/* ---------- tabs ---------- */
function showTab(which){
  $("tab-log").setAttribute("aria-selected",which==="log"); $("tab-rates").setAttribute("aria-selected",which==="rates");
  $("view-log").hidden = which!=="log"; $("view-rates").hidden = which!=="rates";
  try{ localStorage.setItem("unhaeng.tab",which); }catch{}
}
$("tab-log").onclick=()=>showTab("log"); $("tab-rates").onclick=()=>showTab("rates");
try{ if(localStorage.getItem("unhaeng.tab")==="rates") showTab("rates"); }catch{}

function renderAll(){
  if (!$("fDate").value) $("fDate").value=ymd(new Date());
  if (document.activeElement?.closest?.("#rateBody")==null) renderRates();
  refreshFormOptions(); renderSummary(); renderLog();
}
try{ navigator.storage?.persist?.(); }catch{}
useLocal();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
